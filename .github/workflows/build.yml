name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests on PC
        run: make -f Makefile.pc test
      - name: Web tests (code completion, graph generator; the generated programs go through the real compiler)
        run: |
          node tests/web/complete.test.js
          node tests/web/graph.test.js
          node tests/web/guide.test.js
      - name: The C graph generator (3DS) gives the same code as the browser one, on fixtures made fresh by the browser tests
        run: |
          MS_DUMP_GRAPHS=/tmp/fgfx node tests/web/graph.test.js > /dev/null
          ./minisharp --fgraph-check /tmp/fgfx

  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build MiniSharp.3dsx
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: MiniSharp-3dsx
          path: MiniSharp.3dsx

  # The browser version (WebAssembly), built with Zig from the same C sources
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web/dist
        run: |
          pip install ziglang==0.17.0
          sh web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Every push to main updates https://<user>.github.io/minisharp/
  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-pc, build-web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # A tag like v0.2.0 publishes a GitHub Release with the .3dsx, once the tests pass.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-pc, build-3ds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiniSharp-3dsx
      - uses: softprops/action-gh-release@v2
        with:
          files: MiniSharp.3dsx
          generate_release_notes: true
          body: |
            **Instalacja:** skopiuj `MiniSharp.3dsx` do `sdmc:/3ds/` i uruchom z Homebrew Launchera.
            Przy pierwszym starcie aplikacja tworzy `sdmc:/minisharp/` z przykładami (A uruchamia, START wraca do menu).
