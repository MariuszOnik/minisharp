name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests on PC
        run: make -f Makefile.pc test

  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build MiniSharp.3dsx
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: MiniSharp-3dsx
          path: MiniSharp.3dsx
